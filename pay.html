<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pay via UPI</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .amount-label {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 700;
      color: #1c1c2e;
      margin-bottom: 4px;
    }

    .app-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      border: 1.5px solid #e0e0e0;
      border-radius: 14px;
      text-decoration: none;
      color: #1c1c2e;
      background: #fff;
      font-size: 1rem;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
      transition: border-color .15s, box-shadow .15s, transform .1s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .app-btn:hover {
      border-color: #1a73e8;
      box-shadow: 0 4px 16px rgba(26,115,232,.15);
    }

    .app-btn:active { transform: scale(.97); }

    .app-icon {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      border-radius: 8px;
      object-fit: contain;
    }

    .invalid-screen {
      text-align: center;
      color: #e53935;
      font-size: 1rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container" id="mainContent" style="display:none">
    <div class="amount-label" id="amtDisplay">₹0.00</div>

    <a class="app-btn" id="aGpay" href="#">
      <img class="app-icon" src="static/gpay.svg" alt="Google Pay">
      Google Pay
    </a>

    <a class="app-btn" id="aPhonepe" href="#">
      <img class="app-icon" src="static/phonepe.svg" alt="PhonePe">
      PhonePe
    </a>

    <a class="app-btn" id="aPaytm" href="#">
      <img class="app-icon" src="static/paytm.svg" alt="Paytm">
      Paytm
    </a>

    <a class="app-btn" id="aBhim" href="#">
      <img class="app-icon" src="static/bhim.svg" alt="BHIM">
      BHIM
    </a>
  </div>

  <div class="invalid-screen" id="errScreen" style="display:none">
    Invalid amount
  </div>

  <script>
    (function () {
      var PA = 'mab.037348011560040@axisbank';
      var PN = 'Avinya%20Name';
      var CU = 'INR';

      var qs  = new URLSearchParams(window.location.search);
      var raw = parseFloat(qs.get('amount'));

      if (!raw || isNaN(raw) || raw <= 0) {
        document.getElementById('errScreen').style.display = '';
        return;
      }

      var amt = raw.toFixed(2);
      document.getElementById('amtDisplay').textContent = '₹' + amt;
      document.getElementById('mainContent').style.display = '';

      function upiLink(scheme) {
        return scheme + '?pa=' + PA + '&pn=' + PN + '&am=' + amt + '&cu=' + CU;
      }

      document.getElementById('aGpay').href    = upiLink('tez://upi/pay');
      document.getElementById('aPhonepe').href = upiLink('phonepe://pay');
      document.getElementById('aPaytm').href   = upiLink('paytmmp://pay');
      document.getElementById('aBhim').href    = upiLink('upi://pay');
    })();
  </script>
</body>
</html>
