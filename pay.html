<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pay</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
    }

    a.pay-btn {
      display: inline-block;
      padding: 22px 48px;
      font-size: 1.4rem;
      font-weight: 700;
      font-family: sans-serif;
      color: #fff;
      background: #4a90d9;
      border-radius: 12px;
      text-decoration: none;
      text-align: center;
      letter-spacing: 0.02em;
      box-shadow: 0 4px 16px rgba(74, 144, 217, 0.4);
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, transform 0.1s;
    }

    a.pay-btn:active {
      background: #357abd;
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <a class="pay-btn" id="payBtn" href="#">Click Here to Pay</a>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var amount = parseFloat(params.get('amount'));
      if (!amount || isNaN(amount) || amount <= 0) {
        document.getElementById('payBtn').textContent = 'Invalid amount';
        return;
      }
      var formatted = amount.toFixed(2);
      var upi = 'upi://pay?pa=mab.037348011560040@axisbank&pn=Avinya%20Name&am=' + formatted + '&cu=INR';
      var btn = document.getElementById('payBtn');
      btn.href = upi;
      btn.textContent = 'Pay ₹' + formatted;
    })();
  </script>
</body>
</html>
