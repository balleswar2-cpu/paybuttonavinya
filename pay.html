<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pay via UPI</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .amount-label {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 700;
      color: #1c1c2e;
      margin-bottom: 4px;
    }

    /* ── App buttons ── */
    .app-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      border: 1.5px solid #e0e0e0;
      border-radius: 14px;
      text-decoration: none;
      color: #1c1c2e;
      background: #fff;
      font-size: 1rem;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
      transition: border-color .15s, box-shadow .15s, transform .1s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .app-btn:hover {
      border-color: #1a73e8;
      box-shadow: 0 4px 16px rgba(26,115,232,.15);
    }

    .app-btn:active { transform: scale(.97); }

    .app-icon {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      border-radius: 8px;
      object-fit: contain;
    }

    /* ── Safari card ── */
    .safari-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 16px rgba(0,0,0,.08);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
    }

    .safari-note {
      font-size: 0.85rem;
      color: #888;
    }

    .upi-id-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #aaa;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .upi-id-copy {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      background: #f9f9f9;
      font-size: 0.95rem;
      font-weight: 700;
      color: #1c1c2e;
      cursor: pointer;
      transition: border-color .15s, background .15s, transform .1s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .upi-id-copy:hover { border-color: #1a73e8; background: #f0f6ff; }
    .upi-id-copy:active { transform: scale(.97); }

    .copy-toast {
      font-size: 0.78rem;
      color: #34a853;
      font-weight: 600;
      min-height: 1em;
      margin-top: 8px;
    }

    /* ── Error ── */
    .error-screen {
      text-align: center;
      color: #e53935;
      font-size: 1rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container" id="mainContent" style="display:none">
    <div class="amount-label" id="amtDisplay" style="display:none"></div>

    <!-- Non-Safari: app buttons -->
    <div id="appButtons" style="display:flex;flex-direction:column;gap:12px;">
      <a class="app-btn" id="aGpay" href="#">
        <img class="app-icon" src="static/gpay.svg" alt="Google Pay">
        Google Pay
      </a>
      <a class="app-btn" id="aPhonepe" href="#">
        <img class="app-icon" src="static/phonepe.svg" alt="PhonePe">
        PhonePe
      </a>
      <a class="app-btn" id="aPaytm" href="#">
        <img class="app-icon" src="static/paytm.svg" alt="Paytm">
        Paytm
      </a>
      <a class="app-btn" id="aBhim" href="#">
        <img class="app-icon" src="static/bhim.svg" alt="BHIM">
        BHIM
      </a>
    </div>

    <!-- Safari: note + UPI ID -->
    <div id="safariCard" class="safari-card" style="display:none">
      <p class="safari-note">Use QR code below.</p>
      <div>
        <div class="upi-id-label">UPI ID</div>
        <div class="upi-id-copy" id="copyBtn">
          <span>mab.037348011560040@axisbank</span>
          <span>⧉</span>
        </div>
        <div class="copy-toast" id="copyToast"></div>
      </div>
    </div>
  </div>

  <div class="error-screen" id="errScreen" style="display:none">
    Invalid amount
  </div>

  <script>
    (function () {
      var PA = 'mab.037348011560040@axisbank';
      var PN = 'APOLLO HOSPITALS EDUCATIONAL RESEARCH FOUNDATION AVINYA%20Name';
      var CU = 'INR';

      var qs  = new URLSearchParams(window.location.search);
      var raw = parseFloat(qs.get('amount'));
      var hasAmount = raw && !isNaN(raw) && raw > 0;
      var amt = hasAmount ? raw.toFixed(2) : null;

      document.getElementById('mainContent').style.display = '';

      if (amt) {
        var amtEl = document.getElementById('amtDisplay');
        amtEl.textContent = '₹' + amt;
        amtEl.style.display = '';
      }

      function upiLink(scheme) {
        var link = scheme + '?pa=' + PA + '&pn=' + PN + '&cu=' + CU;
        if (amt) link += '&am=' + amt;
        return link;
      }

      // Source - https://stackoverflow.com/a/31732310
      // Posted by qingu, modified by community. See post 'Timeline' for change history
      // Retrieved 2026-06-14, License - CC BY-SA 4.0
      var isSafari = navigator.vendor && navigator.vendor.indexOf('Apple') > -1 &&
                     navigator.userAgent &&
                     navigator.userAgent.indexOf('CriOS') == -1 &&
                     navigator.userAgent.indexOf('FxiOS') == -1;

      if (isSafari) {
        document.getElementById('appButtons').style.display = 'none';
        document.getElementById('safariCard').style.display = '';

        document.getElementById('copyBtn').addEventListener('click', function () {
          var toast = document.getElementById('copyToast');
          navigator.clipboard.writeText(PA).then(function () {
            toast.textContent = 'Copied!';
            setTimeout(function () { toast.textContent = ''; }, 2000);
          }).catch(function () {
            var tmp = document.createElement('textarea');
            tmp.value = PA;
            tmp.style.cssText = 'position:fixed;opacity:0';
            document.body.appendChild(tmp);
            tmp.select();
            document.execCommand('copy');
            document.body.removeChild(tmp);
            toast.textContent = 'Copied!';
            setTimeout(function () { toast.textContent = ''; }, 2000);
          });
        });
      } else {
        document.getElementById('aGpay').href    = upiLink('tez://upi/pay');
        document.getElementById('aPhonepe').href = upiLink('phonepe://pay');
        document.getElementById('aPaytm').href   = upiLink('paytmmp://pay');
        document.getElementById('aBhim').href    = upiLink('upi://pay');
      }
    })();
  </script>
</body>
</html>
