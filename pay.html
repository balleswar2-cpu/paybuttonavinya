<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pay via UPI</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .amount-label {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 700;
      color: #1c1c2e;
      margin-bottom: 4px;
    }

    /* ── App buttons (non-Safari) ── */
    .app-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      border: 1.5px solid #e0e0e0;
      border-radius: 14px;
      text-decoration: none;
      color: #1c1c2e;
      background: #fff;
      font-size: 1rem;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
      transition: border-color .15s, box-shadow .15s, transform .1s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .app-btn:hover {
      border-color: #1a73e8;
      box-shadow: 0 4px 16px rgba(26,115,232,.15);
    }

    .app-btn:active { transform: scale(.97); }

    .app-icon {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      border-radius: 8px;
      object-fit: contain;
    }

    /* ── Safari fallback ── */
    .safari-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 16px rgba(0,0,0,.08);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
    }

    .safari-note {
      font-size: 0.85rem;
      color: #888;
      line-height: 1.5;
    }

    .qr-img {
      width: 180px;
      height: 180px;
      border-radius: 10px;
      border: 1px solid #e0e0e0;
    }

    .upi-id-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #aaa;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .upi-id-copy {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      background: #f9f9f9;
      font-size: 0.95rem;
      font-weight: 700;
      color: #1c1c2e;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .upi-id-copy:hover { border-color: #1a73e8; background: #f0f6ff; }
    .upi-id-copy:active { transform: scale(.97); }

    .copy-icon {
      font-size: 1rem;
      flex-shrink: 0;
    }

    .copy-toast {
      font-size: 0.78rem;
      color: #34a853;
      font-weight: 600;
      min-height: 1em;
      transition: opacity .3s;
    }

    /* ── Error ── */
    .invalid-screen {
      text-align: center;
      color: #e53935;
      font-size: 1rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container" id="mainContent" style="display:none">
    <div class="amount-label" id="amtDisplay">₹0.00</div>

    <!-- Non-Safari: app buttons -->
    <div id="appButtons">
      <div style="display:flex;flex-direction:column;gap:12px;">
        <a class="app-btn" id="aGpay" href="#">
          <img class="app-icon" src="static/gpay.svg" alt="Google Pay">
          Google Pay
        </a>
        <a class="app-btn" id="aPhonepe" href="#">
          <img class="app-icon" src="static/phonepe.svg" alt="PhonePe">
          PhonePe
        </a>
        <a class="app-btn" id="aPaytm" href="#">
          <img class="app-icon" src="static/paytm.svg" alt="Paytm">
          Paytm
        </a>
        <a class="app-btn" id="aBhim" href="#">
          <img class="app-icon" src="static/bhim.svg" alt="BHIM">
          BHIM
        </a>
      </div>
    </div>

    <!-- Safari: QR + UPI ID -->
    <div id="safariCard" class="safari-card">
      <p class="safari-note">Safari doesn't support UPI deep links.<br>Scan the QR code or copy the UPI ID below.</p>
      <img class="qr-img" id="qrImg" src="" alt="UPI QR Code">
      <div>
        <div class="upi-id-label">UPI ID</div>
        <div style="height:6px"></div>
        <div class="upi-id-copy" id="copyBtn">
          <span id="upiIdText">mab.037348011560040@axisbank</span>
          <span class="copy-icon">⧉</span>
        </div>
        <div style="height:8px"></div>
        <div class="copy-toast" id="copyToast"></div>
      </div>
    </div>
  </div>

  <div class="invalid-screen" id="errScreen" style="display:none">
    Invalid amount
  </div>

  <script>
    (function () {
      var PA  = 'mab.037348011560040@axisbank';
      var PN  = 'Avinya%20Name';
      var CU  = 'INR';

      var qs  = new URLSearchParams(window.location.search);
      var raw = parseFloat(qs.get('amount'));

      if (!raw || isNaN(raw) || raw <= 0) {
        document.getElementById('errScreen').style.display = '';
        return;
      }

      var amt = raw.toFixed(2);
      document.getElementById('amtDisplay').textContent = '₹' + amt;
      document.getElementById('mainContent').style.display = '';

      function upiLink(scheme) {
        return scheme + '?pa=' + PA + '&pn=' + PN + '&am=' + amt + '&cu=' + CU;
      }

      var isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);

      if (isSafari) {
        document.getElementById('appButtons').style.display = 'none';

        var upiUri = upiLink('upi://pay');
        document.getElementById('qrImg').src =
          'https://api.qrserver.com/v1/create-qr-code/?size=200x200&ecc=M&data=' + encodeURIComponent(upiUri);

        document.getElementById('copyBtn').addEventListener('click', function () {
          var text = PA;
          var toast = document.getElementById('copyToast');
          navigator.clipboard.writeText(text).then(function () {
            toast.textContent = 'Copied!';
            setTimeout(function () { toast.textContent = ''; }, 2000);
          }).catch(function () {
            var tmp = document.createElement('textarea');
            tmp.value = text;
            tmp.style.position = 'fixed';
            tmp.style.opacity = '0';
            document.body.appendChild(tmp);
            tmp.select();
            document.execCommand('copy');
            document.body.removeChild(tmp);
            toast.textContent = 'Copied!';
            setTimeout(function () { toast.textContent = ''; }, 2000);
          });
        });
      } else {
        document.getElementById('safariCard').style.display = 'none';
        document.getElementById('aGpay').href    = upiLink('tez://upi/pay');
        document.getElementById('aPhonepe').href = upiLink('phonepe://pay');
        document.getElementById('aPaytm').href   = upiLink('paytmmp://pay');
        document.getElementById('aBhim').href    = upiLink('upi://pay');
      }
    })();
  </script>
</body>
</html>
