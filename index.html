<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pay</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
    }

    a.pay-btn {
      display: inline-block;
      padding: 22px 48px;
      font-size: 1.4rem;
      font-weight: 700;
      font-family: sans-serif;
      color: #fff;
      background: #4a90d9;
      border-radius: 12px;
      text-decoration: none;
      text-align: center;
      letter-spacing: 0.02em;
      box-shadow: 0 4px 16px rgba(74, 144, 217, 0.4);
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, transform 0.1s;
    }

    a.pay-btn:active {
      background: #357abd;
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <a class="pay-btn" href="gpay://upi/pay?pa=mab.037348011560040@axisbank&pn=Avinya%20Name&am=100.00&cu=INR">
    Click Here to Use UPI
  </a>
</body>
</html>
